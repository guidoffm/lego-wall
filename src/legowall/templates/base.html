<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LEGO-Wandbild-Generator{% endblock %}</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #16181d;
    --muted: #6b7280;
    --line: #e3e5ea;
    --accent: #d01012;
    --accent-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1d2027;
      --ink: #f2f3f5;
      --muted: #a0a5ae;
      --line: #2c3038;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header.top { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1.5rem; }
  header.top h1 { font-size: 1.5rem; margin: 0; }
  header.top .brick {
    display: inline-block; width: 1.1rem; height: 1.1rem; border-radius: 3px;
    background: var(--accent); box-shadow: 1.4rem 0 0 #f5c518, 2.8rem 0 0 #0055bf;
    margin-right: 3rem;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.25rem 1.5rem; margin-bottom: 1.25rem;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 1rem; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .3rem; }
  .hint { font-weight: 400; color: var(--muted); font-size: .8rem; }
  input[type=text], input[type=number], input[type=file], select {
    width: 100%; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: .9rem;
  }
  .check { display: flex; align-items: center; gap: .5rem; font-size: .85rem; font-weight: 600; }
  .check input { width: auto; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px;
    padding: .7rem 1.4rem; font: inherit; font-weight: 700; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  a { color: var(--accent); }
  .error {
    background: #fdecec; border: 1px solid #f3b7b7; color: #8e1114;
    padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: .9rem;
  }
  footer { color: var(--muted); font-size: .8rem; margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { padding: .4rem .5rem; border-bottom: 1px solid var(--line); text-align: left; }
  td.code { text-align: center; font-weight: 700; width: 2.5rem; border-radius: 3px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
  pre.summary { margin: 0; font-size: .82rem; white-space: pre-wrap;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .preview { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line);
             image-rendering: pixelated; display: block; }
  .downloads { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; padding: 0; margin: 0; }
  .downloads a {
    display: inline-block; padding: .45rem .8rem; border: 1px solid var(--line);
    border-radius: 6px; text-decoration: none; font-size: .85rem; background: var(--bg);
  }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brick"></span>
    <h1>LEGO-Wandbild-Generator</h1>
  </header>
  {% block content %}{% endblock %}
  <footer>
    legowall {{ version }} — Farbwerte und Teile-IDs sind Annäherungen aus öffentlichen
    Datenquellen. Vor dem Bestellen bei BrickLink oder Pick a Brick prüfen.
  </footer>
</div>
</body>
</html>
