[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legowall"
version = "1.0.0"
description = "Bilder in LEGO-Wandbilder umrechnen: Raster, Farbauswahl, Stückliste und Bauanleitung"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
legowall = "legowall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legowall = ["palettes/*.json", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Vercel erkennt die FastAPI-App sonst nicht, weil sie unter src/ liegt.
[tool.vercel]
entrypoint = "src.legowall.web:app"
